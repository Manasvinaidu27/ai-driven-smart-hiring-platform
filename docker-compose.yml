services:
  recruiter:
    build: .
    command: python app.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: unless-stopped

  analytics:
    build: .
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    restart: unless-stopped
